name: Windows
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13']
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Validate PowerShell 5.1 syntax
        shell: powershell
        run: |
          Get-ChildItem scripts -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count) { throw ($errors | Out-String) }
          }
      - name: Install Windows audio dependencies
        run: |
          python -m pip install --only-binary=:all: -r requirements.txt
      - name: Check native audio imports
        run: python -c "import faster_whisper, sounddevice, huggingface_hub; print('Windows dependencies OK')"
      - name: Install terminal test dependency
        run: |
          python -m pip install --only-binary=:all: pywinpty==3.1.2
      - name: Test CLI, installer and audio adapters
        run: python -W error::ResourceWarning -m unittest discover -s tests -v
      - name: Build and verify ZIP
        run: python scripts/build_zip.py
